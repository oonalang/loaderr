name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build job stays read-only; only the release job is granted write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The wrapper is committed without the exec bit to keep Windows checkouts clean.
      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Verify UI and native component contracts
        run: |
          python3 qa/verify_ui_contract.py
          sha256sum --check qa/unchanged_native_components_sha256.txt

      - name: Unit and render tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shai-loader-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  startup:
    name: Startup (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shai-loader-debug
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the APK with real Android rendering
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # The entrance animation is the regression trigger. Do not disable it.
          disable-animations: false
          script: python3 qa/smoke_startup.py apk/app-debug.apk

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-api-${{ matrix.api }}
          path: build/startup/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [apk, startup]
    # Only main publishes. Pull requests and forks never get the write token.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: shai-loader-debug
          path: apk

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK="$(find apk -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No APK was produced by the build job" >&2
            exit 1
          fi
          # Stable asset name, so the download URL never changes between builds.
          mv "$APK" shai-loader-debug.apk

          # Recreate the release so the `latest` tag points at the commit this
          # APK was actually built from, instead of at an older one.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" >/dev/null 2>&1 || true

          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          Debug build, installable directly. Signed release builds need the keystore properties described in app/build.gradle.kts." \
            shai-loader-debug.apk

          echo "Published:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/latest/shai-loader-debug.apk"
